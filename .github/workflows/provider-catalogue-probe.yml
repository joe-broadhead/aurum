# JOE-2213 — provider catalogue probe (manual / release-gated).
#
# Offline job always runs on workflow_dispatch (no secrets).
# Live job runs only when live=true (optional repository secrets).

name: Provider catalogue probe

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Live vendor catalogue probe (requires secrets)"
        type: boolean
        default: false
      upload_report:
        description: "Upload markdown report artifact"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  offline:
    name: Offline registry dump + default integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master; pin SHA (JOE-1634)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: provider-catalogue-probe
      - name: Probe offline
        run: |
          mkdir -p dist/provider-catalogue
          ./scripts/probe_provider_catalogues.sh --offline \
            --out dist/provider-catalogue/PROBE_REPORT.md
      - name: Upload report
        if: ${{ inputs.upload_report }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-catalogue-probe-offline
          path: dist/provider-catalogue/PROBE_REPORT.md
          if-no-files-found: error

  live:
    name: Live catalogue probe (optional secrets)
    if: ${{ inputs.live }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master; pin SHA (JOE-1634)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: provider-catalogue-probe
      - name: Probe live
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p dist/provider-catalogue
          ./scripts/probe_provider_catalogues.sh --live \
            --out dist/provider-catalogue/PROBE_REPORT_LIVE.md
      - name: Upload live report
        if: ${{ always() && inputs.upload_report }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-catalogue-probe-live
          path: dist/provider-catalogue/PROBE_REPORT_LIVE.md
          if-no-files-found: warn
