[package]
name = "aurum-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "C ABI for aurum-core STT embeds (PCM, preload, cancel, rules cleanup)"
readme = "README.md"
keywords = ["transcription", "whisper", "ffi", "stt", "asr"]
categories = ["api-bindings", "multimedia::audio"]
include = [
  "src/**/*",
  "include/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE",
]

[lib]
name = "aurum_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = ["tts"]
## Local TTS jobs via aurum-core (JOE-1629).
tts = ["aurum-core/tts"]

[dependencies]
# Features come from workspace default (tts on) unless callers disable defaults.
aurum-core = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
