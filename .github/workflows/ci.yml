name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: version sync
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

      - name: action pin policy (JOE-1634)
        run: |
          chmod +x scripts/check_action_pins.sh
          ./scripts/check_action_pins.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg || true

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ffmpeg -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum

      - name: test
        run: cargo test --workspace --locked

      - name: release build CLI
        run: cargo build -p aurum-stt --release --locked

      # JOE-1647: compile/link/run downstream C11 + C++17 clients against release aurum-ffi.
      - name: native C11/C++17 FFI examples
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p aurum-ffi --release --locked
          INC=crates/aurum-ffi/include
          LIB=target/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # MSVC/GNU mixed runners: prefer cl if present, else skip with note.
            if command -v cl >/dev/null 2>&1; then
              echo "MSVC C/C++ FFI example build not yet wired for Windows runner; covering via Unix matrices"
            else
              echo "Windows: skipping native example link (no cl); covered on ubuntu/macos"
            fi
            exit 0
          fi
          EXTRA_LIBS="-lpthread -ldl -lm"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA_LIBS="-lpthread -ldl -lm -framework Security -framework CoreFoundation"
          fi
          cc -std=c11 -I "$INC" crates/aurum-ffi/examples/job_cleanup.c \
            -L "$LIB" -laurum_ffi $EXTRA_LIBS -o /tmp/aurum_job_cleanup
          c++ -std=c++17 -I "$INC" crates/aurum-ffi/examples/engine_raii.cpp \
            -L "$LIB" -laurum_ffi $EXTRA_LIBS -o /tmp/aurum_engine_raii
          export DYLD_LIBRARY_PATH="$LIB:${DYLD_LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}"
          /tmp/aurum_job_cleanup
          /tmp/aurum_engine_raii

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: "1.89.0"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum-msrv
      - run: cargo check --workspace --locked

  # STT-only matrix (JOE-1633): ensure default TTS feature is optional for core consumers.
  stt-only:
    name: STT-only (no default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum-stt-only
      - name: check aurum-core without default features
        run: cargo check -p aurum-core --no-default-features --locked
      - name: test fault injection + adversarial (default features)
        run: |
          cargo test -p aurum-core --test fault_injection --locked
          cargo test -p aurum-core --test adversarial_parsers --locked

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install cargo-audit and cargo-deny
        run: |
          # cargo-audit >= 0.22 required for CVSS 4.0 entries in advisory-db (2026+).
          cargo install cargo-audit --locked --version 0.22.2 || cargo install cargo-audit --locked
          # 0.19+ for unmaintained=workspace policy in deny.toml
          cargo install cargo-deny --locked --version 0.19.0 || cargo install cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  integration-local:
    name: integration (local tiny-q5_1, macOS)
    runs-on: macos-14
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum
      - run: brew install cmake ffmpeg || true
      - name: Local speech integration
        env:
          AURUM_INTEGRATION: "1"
        run: cargo test -p aurum-core --test local_integration --locked -- --ignored --nocapture
