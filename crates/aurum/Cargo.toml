[package]
name = "aurum-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aurum-stt"
rust-version.workspace = true
description = "Audio in. Text out. On-device by default."
readme = "README.md"
keywords = ["transcription", "whisper", "speech-to-text", "cli", "stt"]
categories = ["command-line-utilities", "multimedia::audio"]
include = [
  "src/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE",
]

[lib]
name = "aurum"
path = "src/lib.rs"

[[bin]]
name = "aurum"
path = "src/main.rs"

[dependencies]
aurum-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
