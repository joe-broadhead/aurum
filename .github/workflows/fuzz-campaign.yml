# Scheduled multi-hour cargo-fuzz campaigns (JOE-1884).
# Resource-capped; crash artifacts uploaded for triage.
name: Fuzz campaign

on:
  schedule:
    # Twice weekly: Mon/Thu 06:00 UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per target (default 1800 = 30m)"
        required: false
        default: "1800"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-campaign
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  campaign:
    name: long campaign (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - config_toml
          - stt_dto_json
          - segment_validate
          - rules_cleanup
          - output_format
          - wav_parse
          - ffi_validators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: nightly

      - name: Install cargo-fuzz (stable host)
        run: cargo +stable install cargo-fuzz --locked --version 0.12.0 --force

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum-fuzz-campaign
          workspaces: fuzz

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Resolve duration
        id: dur
        shell: bash
        env:
          INPUT_MAX: ${{ inputs.max_total_time }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_MAX:-}" ]; then
            echo "seconds=${INPUT_MAX}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled runs: 1 hour per target, still resource-capped.
            echo "seconds=3600" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          set -euo pipefail
          SECONDS_LIMIT="${{ steps.dur.outputs.seconds }}"
          echo "Running ${{ matrix.target }} for ${SECONDS_LIMIT}s"
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${SECONDS_LIMIT}" \
            -rss_limit_mb=2048 \
            -timeout=30

      - name: Upload crash artifacts (if any)
        if: failure() || always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
