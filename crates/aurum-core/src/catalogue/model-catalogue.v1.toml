# Aurum reviewed model catalogue, schema v1.
#
# This file is the single reviewed source of truth for built-in local model
# identity: ids, aliases, support tiers, licenses, immutable source URLs, exact
# sizes and SHA-256 pins. Parity tests keep the legacy Rust tables
# (`model::MODELS`, `tts::catalogue::MODELS`) identical to it while their
# consumers migrate (#125).
#
# Rules enforced by the loader and tests:
# - local records only (remote providers own their capabilities elsewhere);
# - downloadable Hugging Face URLs use an immutable 40-hex revision, never `main`;
# - defaults are a single global per direction and must be `supported`;
#   experimental records are reachable by explicit model id only.
schema_version = 1

[defaults.stt]
global = "base"

[defaults.tts]
global = "kitten-nano-int8"

