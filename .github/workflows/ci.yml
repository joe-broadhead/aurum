name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: version sync
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

      - name: action pin policy (JOE-1634)
        run: |
          chmod +x scripts/check_action_pins.sh
          ./scripts/check_action_pins.sh

      - name: crates.io publish policy (JOE-1915 / JOE-1920)
        run: |
          chmod +x scripts/check_crates_publish_policy.sh
          ./scripts/check_crates_publish_policy.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg || true

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Prefer preinstalled tools on GitHub-hosted images; Chocolatey is flaky (504s).
          if ! command -v cmake >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if choco install cmake -y --no-progress; then
                break
              fi
              echo "choco cmake attempt ${attempt} failed; retrying..."
              sleep 20
            done
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if choco install ffmpeg -y --no-progress; then
                break
              fi
              echo "choco ffmpeg attempt ${attempt} failed; retrying..."
              sleep 20
            done
          fi
          echo "/c/Program Files/CMake/bin" >> "$GITHUB_PATH"
          cmake --version
          command -v ffmpeg || true

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum

      - name: test
        run: cargo test --workspace --locked

      - name: release build CLI
        run: cargo build -p aurum-stt --release --locked

      # JOE-1647: compile/link/run downstream C11 + C++17 clients against release aurum-ffi.
      # STT/cleanup only (--no-default-features) so host link does not need ORT.
      - name: native C11/C++17 FFI examples
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Windows: C/C++ example host link deferred (MSVC wiring); covered on ubuntu/macos"
            exit 0
          fi
          cargo build -p aurum-ffi --release --locked --no-default-features
          INC=crates/aurum-ffi/include
          LIB=target/release
          # Staticlib needs whisper/ggml system deps + C++ runtime.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cc -std=c11 -I "$INC" crates/aurum-ffi/examples/job_cleanup.c \
              "$LIB/libaurum_ffi.a" \
              -lpthread -ldl -lm -lc++ \
              -framework Security -framework CoreFoundation \
              -framework Metal -framework Foundation -framework Accelerate \
              -o /tmp/aurum_job_cleanup
            c++ -std=c++17 -I "$INC" crates/aurum-ffi/examples/engine_raii.cpp \
              "$LIB/libaurum_ffi.a" \
              -lpthread -ldl -lm -lc++ \
              -framework Security -framework CoreFoundation \
              -framework Metal -framework Foundation -framework Accelerate \
              -o /tmp/aurum_engine_raii
          else
            # Linux: staticlib pulls whisper + C++ deps
            cc -std=c11 -I "$INC" crates/aurum-ffi/examples/job_cleanup.c \
              "$LIB/libaurum_ffi.a" \
              -lpthread -ldl -lm -lstdc++ -o /tmp/aurum_job_cleanup
            c++ -std=c++17 -I "$INC" crates/aurum-ffi/examples/engine_raii.cpp \
              "$LIB/libaurum_ffi.a" \
              -lpthread -ldl -lm -lstdc++ -o /tmp/aurum_engine_raii
          fi
          /tmp/aurum_job_cleanup
          /tmp/aurum_engine_raii

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: "1.89.0"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-msrv
      - run: cargo check --workspace --locked

  # STT-only matrix (JOE-1633): ensure default TTS feature is optional for core consumers.
  stt-only:
    name: STT-only (no default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-stt-only
      - name: check aurum-core without default features
        run: cargo check -p aurum-core --no-default-features --locked
      - name: test fault injection + adversarial (default features)
        run: |
          cargo test -p aurum-core --test fault_injection --locked
          cargo test -p aurum-core --test adversarial_parsers --locked
      - name: mutation semantics kill list (JOE-1886)
        run: cargo test -p aurum-core --test mutation_semantics --no-default-features --locked

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install cargo-audit and cargo-deny (fail-closed pinned versions)
        run: |
          # JOE-1715: exact reviewed versions only — no fallback to latest.
          # cargo-audit >= 0.22 required for CVSS 4.0 entries in advisory-db (2026+).
          cargo install cargo-audit --locked --version 0.22.2 --force
          # 0.19+ for unmaintained=workspace policy in deny.toml
          cargo install cargo-deny --locked --version 0.19.0 --force
      - name: Assert security tool install is fail-closed
        run: ./scripts/check_security_tool_pins.sh
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  fuzz-smoke:
    name: fuzz smoke (nightly, short)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Install cargo-fuzz on stable — building it on bleeding nightly can break
      # transitive deps (rustix cfg attrs). Fuzz *targets* still need nightly.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: nightly
      - name: Install cargo-fuzz (stable host)
        run: cargo +stable install cargo-fuzz --locked --version 0.12.0 --force
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-fuzz
          workspaces: fuzz
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - name: Short fuzz campaigns (JOE-1861 / JOE-1884)
        working-directory: fuzz
        run: |
          set -euo pipefail
          # Keep PR smoke short and resource-capped; full campaigns are scheduled/local.
          for t in config_toml stt_dto_json segment_validate rules_cleanup output_format wav_parse ffi_validators; do
            echo "== fuzz $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=20 -rss_limit_mb=2048
          done

  # Tier A clean-install matrix (JOE-1883): blocks release readiness when red.
  clean-install:
    name: clean-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Prefer preinstalled cmake; Chocolatey community feed is flaky (504 Gateway Timeout).
          if command -v cmake >/dev/null 2>&1; then
            cmake --version
            exit 0
          fi
          for attempt in 1 2 3; do
            if choco install cmake -y --no-progress; then
              echo "/c/Program Files/CMake/bin" >> "$GITHUB_PATH"
              export PATH="/c/Program Files/CMake/bin:$PATH"
              cmake --version
              exit 0
            fi
            echo "choco cmake attempt ${attempt} failed; retrying..."
            sleep 20
          done
          echo "cmake not available after retries" >&2
          exit 1

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-clean-install

      - name: Clean-install smoke from source (JOE-1883)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/clean_install_smoke.sh scripts/install.sh
          ./scripts/clean_install_smoke.sh --from-source

  # RC exit pack: downstream consumers + full exit report (JOE-1903 / JOE-1904).
  rc-exit-pack:
    name: rc exit pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-rc-exit
      - name: Downstream + RC exit report
        run: |
          set -euo pipefail
          chmod +x scripts/rc_downstream_check.sh scripts/generate_rc_exit_report.sh \
            scripts/rc_freeze_check.sh scripts/generate_sbom.sh \
            scripts/rehearse_rc_rollback.sh scripts/rehearse_model_revocation.sh \
            scripts/rehearse_disclosure_tabletop.sh scripts/version_check.sh
          ./scripts/rc_downstream_check.sh
          ./scripts/generate_rc_exit_report.sh dist/rc-exit
      - name: Upload RC exit pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-exit-pack
          path: |
            dist/rc-exit/
            dist/sbom/native-components.md
            dist/security-rehearsal/
          if-no-files-found: error
          retention-days: 30

  # RC freeze inventory automated checks (JOE-1896).
  rc-freeze-check:
    name: rc freeze check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-rc-freeze
      - name: RC freeze inventory check
        run: |
          set -euo pipefail
          chmod +x scripts/rc_freeze_check.sh scripts/version_check.sh
          ./scripts/rc_freeze_check.sh

  # RC dogfood automated subset (JOE-1897).
  rc-dogfood-smoke:
    name: rc dogfood smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-rc-dogfood
      - name: RC dogfood automated checklist
        run: |
          set -euo pipefail
          chmod +x scripts/rc_dogfood_checklist.sh scripts/rc_freeze_check.sh \
            scripts/clean_install_smoke.sh scripts/install.sh \
            scripts/rehearse_rc_rollback.sh scripts/rehearse_model_revocation.sh \
            scripts/rehearse_disclosure_tabletop.sh
          ./scripts/rc_dogfood_checklist.sh --out dist/rc-dogfood
          ./scripts/rehearse_rc_rollback.sh
      - name: Upload RC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-dogfood-evidence
          path: |
            dist/rc-dogfood/
            dist/security-rehearsal/
          if-no-files-found: ignore
          retention-days: 30

  # Security evidence rehearsals (JOE-1890 / JOE-1892) — no pin mutations.
  security-rehearsal:
    name: security rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-sec-rehearsal
      - name: Model revocation + disclosure tabletop
        run: |
          set -euo pipefail
          chmod +x scripts/rehearse_model_revocation.sh scripts/rehearse_disclosure_tabletop.sh
          ./scripts/rehearse_model_revocation.sh
          ./scripts/rehearse_disclosure_tabletop.sh
      - name: Upload rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-rehearsal-pr
          path: dist/security-rehearsal/
          if-no-files-found: error
          retention-days: 14

  # JOE-2229: dry-run protected evidence schema + canary (no network).
  provider-smoke-dry-run:
    name: provider smoke dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dry-run protected smoke schema
        env:
          AURUM_SMOKE_SKIP_RELEASE_GATE: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/protected_provider_smoke.sh
          ./scripts/protected_provider_smoke.sh --dry-run --out dist/provider-smoke
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-smoke-dry-run
          path: |
            dist/provider-smoke/SMOKE_SUMMARY.md
            dist/provider-smoke/records/
          if-no-files-found: error
          retention-days: 7

  # JOE-2231: production pack recipe integrity + synthetic coverage dry-run.
  observatory-recipe-check:
    name: observatory recipe check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Recipe integrity + dry-run production coverage
        run: |
          set -euo pipefail
          chmod +x scripts/eval/prepare_stt_observatory_corpus.sh
          ./scripts/eval/prepare_stt_observatory_corpus.sh --core
          ./scripts/eval/prepare_stt_observatory_corpus.sh --recipe-check
          ./scripts/eval/prepare_stt_observatory_corpus.sh \
            --dry-run-production --cache-dir "$RUNNER_TEMP/aurum-obs-cache"

  # Pure-Rust Miri suite (JOE-1889) — curated filters only; see qe-depth.md.
  miri:
    name: miri (pure filters)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: nightly
          components: miri
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-miri
      - name: Miri pure suite
        run: |
          set -euo pipefail
          chmod +x scripts/run_miri.sh
          cargo +nightly miri setup
          ./scripts/run_miri.sh

  # ASan (Linux) + concurrency stress (JOE-1887).
  sanitizer-stress:
    name: sanitizer + stress
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: nightly
          components: rust-src
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-sanitizer
      - name: ASan pure filters + concurrency stress
        run: |
          set -euo pipefail
          chmod +x scripts/run_sanitizers.sh
          ./scripts/run_sanitizers.sh --asan

  # JOE-2228 pure-filter UB matrix (overflow-checks fallback when rustc lacks UBSan).
  ubsan-pure:
    name: ubsan (pure filters)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: nightly
          components: rust-src
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-ubsan
      - name: Pure-filter UB matrix (JOE-2228)
        run: |
          set -euo pipefail
          chmod +x scripts/run_sanitizers.sh
          ./scripts/run_sanitizers.sh --ubsan

  # Module-scoped trust coverage report (JOE-1888).
  coverage-trust:
    name: coverage (trust modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-coverage
      - name: Trust-boundary coverage report
        run: |
          set -euo pipefail
          chmod +x scripts/coverage_trust.sh
          ./scripts/coverage_trust.sh dist/coverage-trust
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trust-coverage
          path: dist/coverage-trust/
          if-no-files-found: error
          retention-days: 30

  # Sharded cargo-mutants smoke (JOE-1886).
  mutants-smoke:
    name: mutants smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-mutants
      - name: Mutation smoke (scoped)
        run: |
          set -euo pipefail
          chmod +x scripts/run_mutants.sh
          ./scripts/run_mutants.sh --smoke
      - name: Upload mutants summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutants-smoke
          path: dist/mutants/
          if-no-files-found: ignore
          retention-days: 30

  # Dual rebuild smoke (JOE-1885): measure variance; do not require bit-match.
  repro-smoke:
    name: repro smoke (linux dual build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-repro
      - name: Two-builder comparison
        run: |
          set -euo pipefail
          chmod +x scripts/compare_release_builds.sh
          ./scripts/compare_release_builds.sh --target x86_64-unknown-linux-gnu --out dist/repro
      - name: Upload variance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: repro-variance-smoke
          path: dist/repro/VARIANCE_REPORT.md
          if-no-files-found: error
          retention-days: 14

  integration-local:
    name: integration (local tiny-q5_1, macOS)
    runs-on: macos-14
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum
      - run: brew install cmake ffmpeg || true
      - name: Local speech integration
        env:
          AURUM_INTEGRATION: "1"
        run: cargo test -p aurum-core --test local_integration --locked -- --ignored --nocapture
