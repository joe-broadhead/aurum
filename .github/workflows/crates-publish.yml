name: Publish crates.io

# Manual only. Does not run on tag/push.
# Order for a full release: aurum-core → aurum-stt → aurum-ffi.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git tag or ref to publish from (e.g. v0.0.17 or master)"
        required: true
        type: string
        default: "master"
      crate:
        description: "Which crate to publish"
        required: true
        type: choice
        options:
          - aurum-core
          - aurum-stt
          - aurum-ffi
      dry_run:
        description: "Dry run (no upload)"
        required: true
        type: boolean
        default: true
      skip_tests:
        description: "Skip workspace tests (for historical tag backfill)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm VERSION vs tag
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=${ver} ref=${GIT_REF}"
          if [[ "${GIT_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag_ver="${GIT_REF#v}"
            if [ "${tag_ver}" != "${ver}" ]; then
              echo "Tag ${GIT_REF} does not match VERSION ${ver}"
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Version gate
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

      - name: Test gate
        if: ${{ inputs.skip_tests != true && inputs.skip_tests != 'true' }}
        run: cargo test --workspace --locked

      - name: Package list (always)
        env:
          CRATE: ${{ inputs.crate }}
        run: cargo package -p "${CRATE}" --list --locked | head -40

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for real publish"
            echo "Add it under Settings → Environments → crates-io (or repo secrets)."
            exit 1
          fi
          args=(-p "${CRATE}" --locked --no-verify)
          # --no-verify: avoid re-running full test suite inside cargo publish
          # (we already ran tests unless skip_tests; historical tags may lack modern deps).
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          # aurum-stt / aurum-ffi need matching aurum-core already on crates.io
          cargo publish "${args[@]}"
