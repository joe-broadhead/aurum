name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-aurum

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: version sync
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg || true

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ffmpeg -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-aurum

      - name: test
        run: cargo test --workspace --locked

      - name: release build CLI
        run: cargo build -p aurum --release --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-aurum-msrv
      - run: cargo check --workspace --locked

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  integration-local:
    name: integration (local tiny-q5_1, macOS)
    runs-on: macos-14
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-aurum
      - run: brew install cmake ffmpeg || true
      - name: Local speech integration
        env:
          AURUM_INTEGRATION: "1"
        run: cargo test -p aurum-core --test local_integration --locked -- --ignored --nocapture
