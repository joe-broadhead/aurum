[workspace]
resolver = "2"
members = [
    "crates/aurum-core",
    "crates/aurum",
    "crates/aurum-ffi",
]
default-members = ["crates/aurum"]

[workspace.package]
version = "0.0.18"
edition = "2021"
license = "MIT"
authors = ["Joe Broadhead"]
repository = "https://github.com/joe-broadhead/aurum"
homepage = "https://github.com/joe-broadhead/aurum"
documentation = "https://joe-broadhead.github.io/aurum/"
rust-version = "1.89"
readme = "README.md"

[workspace.dependencies]
# default-features = false so dependents can opt out of TTS/ORT (JOE-1647 native examples).
aurum-core = { path = "crates/aurum-core", version = "0.0.18", default-features = false }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
directories = "6"
futures-util = "0.3"
hex = "0.4"
hound = "3.5"
indicatif = "0.18"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
which = "7"
wiremock = "0.6"


ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
misaki-rs = { version = "0.3.0", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
