name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg || true

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ffmpeg -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: cargo fmt --check
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --release
        run: cargo build -p aurum --release

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - name: cargo check
        run: cargo check --workspace

  integration-local:
    name: integration (local tiny-q5_1, macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: brew install cmake ffmpeg || true
      - name: Build
        run: cargo build -p aurum --release
      - name: Local speech integration
        env:
          AURUM_INTEGRATION: "1"
        run: |
          cargo test -p aurum-core --test local_integration -- --ignored --nocapture
