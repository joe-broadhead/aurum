name: crates.io token check (JOE-1715)

# Ephemeral positive auth check — no publish. Safe for credential rotation proof.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  me:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: crates-io
    steps:
      - name: Prove CARGO_REGISTRY_TOKEN authenticates (no secret echo)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "FAIL: CARGO_REGISTRY_TOKEN empty in crates-io environment" >&2
            exit 1
          fi
          # Never print token. Query crates.io /api/v1/me
          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -A "aurum-joe1715-token-check (github.com/joe-broadhead/aurum)" \
            -H "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}" \
            -H "Accept: application/json" \
            "https://crates.io/api/v1/me")
          echo "http_status=${code}"
          if [ "${code}" != "200" ]; then
            echo "FAIL: authentication rejected (status ${code})" >&2
            # show error body only if it does not look like it contains a token
            head -c 400 /tmp/me.json || true
            echo
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/me.json"))
          u=d.get("user") or d
          # print non-secret identity fields only
          print("login=", u.get("login") or u.get("name") or "(unknown)")
          print("id=", u.get("id") or "(unknown)")
          print("OK: replacement token authenticates to crates.io /api/v1/me")
          PY
