[workspace]
resolver = "2"
members = [
    "crates/aurum-core",
    "crates/aurum",
]
default-members = ["crates/aurum"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Joe Broadhead"]
repository = "https://github.com/joe-broadhead/aurum"
homepage = "https://github.com/joe-broadhead/aurum"
documentation = "https://joe-broadhead.github.io/aurum/"
rust-version = "1.89"
readme = "README.md"

[workspace.dependencies]
aurum-core = { path = "crates/aurum-core", version = "0.0.0" }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
hound = "3.5"
indicatif = "0.17"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
