name: Publish crates.io

# Manual only. Does not run on tag/push.
# Production publication is tag-only and fully verified (JOE-1915 / F-002).
# Order for a full release: aurum-core → aurum-stt → aurum-ffi.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag only (e.g. v0.0.17). Branches and bare SHAs are rejected."
        required: true
        type: string
      crate:
        description: "Which crate to publish"
        required: true
        type: choice
        options:
          - aurum-core
          - aurum-stt
          - aurum-ffi
      dry_run:
        description: "Dry run (no upload). Dry runs still require an immutable tag."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    steps:
      - name: Require immutable semantic-version tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing publish: tag must match vX.Y.Z (got '${TAG}')." >&2
            echo "Branches, master, and bare SHAs are not allowed (JOE-1915)." >&2
            exit 1
          fi
          echo "tag=${TAG}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tag to exact commit and VERSION
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Missing immutable tag ${TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n1 "${TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "Checkout HEAD ${head_commit} does not match tag ${TAG} → ${tag_commit}" >&2
            exit 1
          fi
          ver="$(tr -d '[:space:]' < VERSION)"
          tag_ver="${TAG#v}"
          if [ "${tag_ver}" != "${ver}" ]; then
            echo "Tag ${TAG} does not match VERSION ${ver}" >&2
            exit 1
          fi
          echo "bound tag=${TAG} commit=${head_commit} version=${ver}"

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Publication policy gate (JOE-1915 / JOE-1920)
        run: |
          chmod +x scripts/check_crates_publish_policy.sh
          ./scripts/check_crates_publish_policy.sh

      - name: Version gate
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

      - name: Test gate (required for real and dry-run publish)
        run: cargo test --workspace --locked

      - name: Enforce reviewed crate publication order
        env:
          CRATE: ${{ inputs.crate }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Code-owned order: aurum-core → aurum-stt → aurum-ffi (CRATE_ORDER / publish_order).
          CRATE_ORDER="aurum-core aurum-stt aurum-ffi"
          case " ${CRATE_ORDER} " in
            *" ${CRATE} "*) ;;
            *)
              echo "Crate '${CRATE}' is not in reviewed CRATE_ORDER: ${CRATE_ORDER}" >&2
              exit 1
              ;;
          esac
          # When publishing dependents, require the prior crate version already on crates.io
          # (except dry-run, where the registry may not yet have this tag's packages).
          ver="${TAG#v}"
          need_prior=""
          case "${CRATE}" in
            aurum-stt) need_prior="aurum-core" ;;
            aurum-ffi) need_prior="aurum-stt" ;;
          esac
          if [ -n "${need_prior}" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            if ! curl -fsSL -A "aurum-publish/1.0" \
              "https://crates.io/api/v1/crates/${need_prior}/${ver}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if 'version' in d else 1)"; then
              echo "Refusing ${CRATE}: prerequisite ${need_prior}@${ver} not on crates.io" >&2
              echo "Publish in order: aurum-core → aurum-stt → aurum-ffi" >&2
              exit 1
            fi
            echo "publish_order ok: ${need_prior}@${ver} present for ${CRATE}"
          fi

      - name: Package list
        env:
          CRATE: ${{ inputs.crate }}
        run: cargo package -p "${CRATE}" --list --locked | head -40

      - name: Publish (verified package contents)
        env:
          # EMERGENCY credential path only (JOE-1715 / JOE-1915). Prefer crates.io
          # trusted publishing/OIDC when configured for this repo/environment.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for real publish" >&2
            echo "This is an emergency long-lived token route; rotate after use (JOE-1715)." >&2
            echo "Prefer crates.io trusted publishing/OIDC when available." >&2
            exit 1
          fi
          # Do NOT pass --no-verify: cargo must re-verify the exact package tarball.
          args=(-p "${CRATE}" --locked)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          cargo publish "${args[@]}"
