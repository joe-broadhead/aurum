name: Publish crates.io

# Manual only. Does not run on tag/push.
# Order: aurum-core first, then aurum-stt, then optional aurum-ffi.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Which crate to publish"
        required: true
        type: choice
        options:
          - aurum-core
          - aurum-stt
          - aurum-ffi
      dry_run:
        description: "Dry run (no upload)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Version gate
        run: |
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh

      - name: Test gate
        run: cargo test --workspace --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for real publish"
            echo "Add it under Settings → Environments → crates-io (or repo secrets)."
            exit 1
          fi
          args=(-p "${CRATE}" --locked)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          # aurum-stt CLI needs aurum-core already on crates.io
          cargo publish "${args[@]}"
