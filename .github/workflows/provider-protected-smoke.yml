# JOE-2229 — protected remote inference smoke (manual / optional secrets).
#
# dry-run (default): schema + canary path, no network — safe for CI wiring.
# live: requires repository secrets; never auto-promotes remotes to supported.

name: Provider protected smoke

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Live credentialed smokes (requires secrets)"
        type: boolean
        default: false
      upload:
        description: "Upload redacted evidence artifact"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run evidence schema + canary
    if: ${{ !inputs.live }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dry-run smoke
        run: |
          set -euo pipefail
          chmod +x scripts/protected_provider_smoke.sh scripts/check_provider_evidence.sh
          ./scripts/protected_provider_smoke.sh --dry-run --out dist/provider-smoke
      - name: Upload
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-protected-smoke-dry-run
          path: |
            dist/provider-smoke/SMOKE_SUMMARY.md
            dist/provider-smoke/records/
          if-no-files-found: error

  live:
    name: Live protected smokes (secrets)
    if: ${{ inputs.live }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Optional: add a GitHub Environment with required reviewers for live smokes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: v2-aurum-provider-smoke
      - name: Live smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ALIAS: ${{ secrets.ELEVENLABS_VOICE_ALIAS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/protected_provider_smoke.sh scripts/check_provider_evidence.sh
          ./scripts/protected_provider_smoke.sh --live --out dist/provider-smoke
      - name: Upload redacted evidence
        if: ${{ always() && inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-protected-smoke-live
          path: |
            dist/provider-smoke/SMOKE_SUMMARY.md
            dist/provider-smoke/records/
          if-no-files-found: warn
