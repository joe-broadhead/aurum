name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example: v0.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
      release_version: ${{ steps.resolve_tag.outputs.release_version }}
    steps:
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_TAG}"
          fi
          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${release_tag}"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release tag (fail-closed)
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          git rev-parse HEAD
          # Refuse detached HEADs that are not exactly the tag object.
          tag_commit="$(git rev-list -n1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "HEAD (${head_commit}) != tag ${RELEASE_TAG} (${tag_commit})"
            exit 1
          fi

      - name: Ensure metadata matches tag
        env:
          RELEASE_VERSION: ${{ steps.resolve_tag.outputs.release_version }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${file_version}" != "${RELEASE_VERSION}" ]; then
            echo "VERSION (${file_version}) != tag (${RELEASE_VERSION})"
            exit 1
          fi
          chmod +x scripts/version_check.sh
          ./scripts/version_check.sh
          grep -qE "^## \\[${RELEASE_VERSION}\\]" CHANGELOG.md

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - name: Test gate
        run: cargo test --workspace --locked
      - name: Security gate
        run: |
          set -euo pipefail
          # JOE-1715: exact reviewed versions only — no fallback to latest.
          # cargo-audit >= 0.22 required for CVSS 4.0 entries in advisory-db (2026+).
          cargo install cargo-audit --locked --version 0.22.2 --force
          # 0.19+ for unmaintained=workspace policy in deny.toml
          cargo install cargo-deny --locked --version 0.19.0 --force
          ./scripts/check_security_tool_pins.sh
          cargo audit
          cargo deny check
      - name: SBOM inventory
        run: |
          chmod +x scripts/generate_sbom.sh
          ./scripts/generate_sbom.sh dist/sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          # Not named aurum-* so binary download pattern stays binary-only.
          name: sbom-inventory
          path: dist/sbom/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: macos-arm64
            bin: aurum
          # Intel Mac (x86_64-apple-darwin): not shipped as a binary.
          # ort download-binaries has no prebuilt ONNX Runtime for cross-compiling
          # x86_64-apple-darwin from Apple Silicon runners. Build from source on Intel Mac:
          #   cargo install aurum-stt --locked
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            bin: aurum
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            bin: aurum.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake -y --no-progress

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3  # v2.7.7
        with:
          prefix-key: v2-aurum-release
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p aurum-stt --release --locked --target "${{ matrix.target }}"
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$src" "dist/aurum-${{ matrix.asset }}.exe"
          else
            cp "$src" "dist/aurum-${{ matrix.asset }}"
            chmod +x "dist/aurum-${{ matrix.asset }}"
          fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: aurum-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [validate, build]
    permissions:
      contents: write
      # Keyless cosign via GitHub OIDC (JOE-1882)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # Pin cosign CLI version for fail-closed releases (JOE-1882).
          cosign-release: v2.4.3

      - name: Download binary artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: artifacts
          pattern: aurum-*
          merge-multiple: true

      - name: Download SBOM artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: sbom-inventory
          path: sbom

      - name: Checksums + SBOM + provenance + cosign (JOE-1859 / JOE-1860 / JOE-1882)
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -print0 | xargs -0 -I{} cp {} release-assets/
          # Prefer SBOM generated on the validated tag commit.
          if [ -d sbom ]; then
            cp -a sbom/. release-assets/
          fi
          chmod +x scripts/generate_sbom.sh scripts/generate_provenance.sh scripts/verify_release_assets.sh
          # Fail closed: formal CycloneDX + SPDX must exist (re-generate if incomplete).
          if [ ! -f release-assets/aurum.cdx.json ] || [ ! -f release-assets/aurum.spdx.json ]; then
            ./scripts/generate_sbom.sh dist/sbom
            cp -a dist/sbom/. release-assets/
          fi
          test -f release-assets/aurum.cdx.json
          test -f release-assets/aurum.spdx.json
          test -f release-assets/aurum-sbom-inventory.json
          # Provenance must record the **tag commit**, not workflow_dispatch HEAD on master.
          # github.sha for workflow_dispatch is the default-branch tip; checkout is the tag.
          TAG_COMMIT="$(git rev-parse HEAD)"
          export GITHUB_SHA="${TAG_COMMIT}"
          # Structured provenance over binaries + SBOM (before final SHA256SUMS).
          ./scripts/generate_provenance.sh release-assets "${RELEASE_TAG}"
          cd release-assets
          # Exclude digest/provenance/signature files from the hashed set, then re-add provenance digests.
          if command -v sha256sum >/dev/null 2>&1; then
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' ! -name 'SHA256SUMS.bundle' \
              ! -name 'PROVENANCE.txt' ! -name 'PROVENANCE.json' \
              -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum PROVENANCE.json PROVENANCE.txt >> SHA256SUMS
          else
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' ! -name 'SHA256SUMS.bundle' \
              ! -name 'PROVENANCE.txt' ! -name 'PROVENANCE.json' \
              -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
            shasum -a 256 PROVENANCE.json PROVENANCE.txt >> SHA256SUMS
          fi
          # Force keyless cosign over SHA256SUMS (JOE-1882).
          cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS
          test -f SHA256SUMS.bundle
          ls -la
          cat SHA256SUMS
          export AURUM_EXPECT_TAG="${RELEASE_TAG}"
          export AURUM_EXPECT_COMMIT="${TAG_COMMIT}"
          export AURUM_REQUIRE_COSIGN=1
          export AURUM_COSIGN_CERTIFICATE_OIDC_ISSUER="https://token.actions.githubusercontent.com"
          # OIDC subject follows the workflow *trigger* ref, not the checked-out tag.
          # - tag push → refs/tags/vX.Y.Z
          # - workflow_dispatch (release-tag helper) → refs/heads/master
          #   (GITHUB_TOKEN tag pushes do not re-trigger workflows, so Tag Release
          #   dispatches this workflow from the default branch.)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            COSIGN_IDENTITY="https://github.com/joe-broadhead/aurum/.github/workflows/release.yml@refs/heads/master"
          else
            COSIGN_IDENTITY="https://github.com/joe-broadhead/aurum/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          fi
          export AURUM_COSIGN_CERTIFICATE_IDENTITY="${COSIGN_IDENTITY}"
          echo "cosign_verify_identity=${COSIGN_IDENTITY}"
          "${GITHUB_WORKSPACE}/scripts/verify_release_assets.sh" .

      - name: Extract changelog section
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["RELEASE_VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pat = rf"## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## |\Z)"
          m = re.search(pat, text, re.S)
          body = m.group(1).strip() if m else f"Release v{ver}"
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          # workflow_dispatch (Tag Release helper) signs under refs/heads/master OIDC.
          if event == "workflow_dispatch":
              cosign_id = (
                  "https://github.com/joe-broadhead/aurum/.github/workflows/"
                  "release.yml@refs/heads/master"
              )
          else:
              cosign_id = (
                  "https://github.com/joe-broadhead/aurum/.github/workflows/"
                  f"release.yml@refs/tags/v{ver}"
              )
          # Append cosign identity hint for operators (JOE-1882).
          body += (
              "\n\n### Supply chain verify\n\n"
              "Download all assets, then:\n\n"
              "```bash\n"
              f"export AURUM_EXPECT_TAG=v{ver}\n"
              "export AURUM_REQUIRE_COSIGN=1\n"
              "export AURUM_COSIGN_CERTIFICATE_OIDC_ISSUER=https://token.actions.githubusercontent.com\n"
              f"export AURUM_COSIGN_CERTIFICATE_IDENTITY={cosign_id}\n"
              "./scripts/verify_release_assets.sh ./release-assets\n"
              "```\n"
              "Note: `workflow_dispatch` releases use the master workflow OIDC "
              "subject; pure tag-push releases use the tag subject.\n"
              "See docs/operations/provenance.md.\n"
          )
          pathlib.Path("release-notes.md").write_text(body + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: ${{ needs.validate.outputs.release_tag }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Second isolated rebuild of linux-x86_64 vs published artifact (JOE-1885).
  repro-compare:
    name: Repro compare (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [validate, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master; pin SHA (JOE-1634)
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Download primary linux binary (builder A)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: aurum-linux-x86_64
          path: primary

      - name: Second builder rebuild + variance report
        run: |
          set -euo pipefail
          chmod +x scripts/compare_release_builds.sh
          baseline="$(find primary -type f \( -name 'aurum-linux-x86_64' -o -name 'aurum' \) | head -1)"
          test -n "${baseline}"
          ./scripts/compare_release_builds.sh \
            --baseline "${baseline}" \
            --target x86_64-unknown-linux-gnu \
            --out dist/repro

      - name: Upload variance report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: repro-variance-linux-x86_64
          path: dist/repro/VARIANCE_REPORT.md
          if-no-files-found: error
          retention-days: 30
